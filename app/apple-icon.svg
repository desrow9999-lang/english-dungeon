<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- 背景グラデーション -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <!-- 枠線グラデーション -->
    <linearGradient id="border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <!-- 発光エフェクト -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 背景パネル -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="url(#border)" stroke-width="8" opacity="0.8"/>
  
  <!-- 魔法陣風のリング -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#38bdf8" stroke-width="4" stroke-dasharray="16 12" opacity="0.5"/>
  <circle cx="256" cy="256" r="140" fill="none" stroke="#fbbf24" stroke-width="2" opacity="0.3"/>

  <!-- 剣モチーフ（発光付き） -->
  <g filter="url(#glow)">
    <text x="256" y="325" font-size="230" text-anchor="middle" font-family="sans-serif">⚔️</text>
  </g>
</svg>
